services:
  web:
    build: .
    container_name: forjageek_web
    ports:
      - "8000:8000"
    restart: unless-stopped

    volumes:
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles

    env_file:
      - .env

    command: >
      sh -c "python manage.py migrate && python manage.py collectstatic --noinput &&
             gunicorn ForjaGeek.wsgi:application --bind 0.0.0.0:8000"

