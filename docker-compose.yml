services:
  web:
    build: .
    container_name: forjageek_web

    ports:
      - "8000:8000"

    volumes:
      - .:/app
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles

    env_file:
      - .env

    restart: unless-stopped

    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn forjageek.wsgi:application --bind 0.0.0.0:8000"