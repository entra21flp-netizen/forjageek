{% extends "core/base.html" %}
{% load static %}
{% block css_extra %}<link rel="stylesheet" href="{% static 'css/homepage.css' %}?v=4"><script src="{% static 'js/homepage.js' %}" defer></script>{% endblock %}

{% block titulo %}ForjaGeek — O mercado dos colecionadores{% endblock %}

{% block conteudo %}

  <section class="homepage-hero" aria-label="ForjaGeek — O mercado dos colecionadores">
    <div class="homepage-arte">
      <img src="{% static 'images/homepage-forjageek.png' %}"
           alt="ForjaGeek — O mercado dos colecionadores. Diorama com cinco personagens originais."
           width="1672" height="941" fetchpriority="high">
    </div>
    <div class="homepage-acoes">
      {% if request.user.is_authenticated %}
        <a class="homepage-botao" href="{% url 'core:prateleira' %}">Minha Estante Virtual</a>
      {% else %}
        <a class="homepage-botao" href="{% url 'core:login' %}">Entrar</a>
      {% endif %}
    </div>
  </section>
{% endblock %}
